services:

  scylla1:
    image: scylladb/scylla:6.2
    container_name: scylla1
    command: >
      --seeds=scylla1
      --smp 1
      --reactor-backend=epoll
      --memory 750M
      --overprovisioned 1
      --api-address 0.0.0.0
    ports:
      - "9042:9042"
      - "10000:10000"
    volumes:
      - scylla1-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT release_version FROM system.local' > /dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 90s

  scylla2:
    image: scylladb/scylla:6.2
    container_name: scylla2
    command: >
      --seeds=scylla1
      --smp 1
      --reactor-backend=epoll
      --memory 750M
      --overprovisioned 1
      --api-address 0.0.0.0
    ports:
      - "9043:9042"
      - "10001:10000"
    volumes:
      - scylla2-data:/var/lib/scylla
    depends_on:
      scylla1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT release_version FROM system.local' > /dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 90s

  scylla3:
    image: scylladb/scylla:6.2
    container_name: scylla3
    command: >
      --seeds=scylla1
      --smp 1
      --reactor-backend=epoll
      --memory 750M
      --overprovisioned 1
      --api-address 0.0.0.0
    ports:
      - "9044:9042"
      - "10002:10000"
    volumes:
      - scylla3-data:/var/lib/scylla
    depends_on:
      scylla1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT release_version FROM system.local' > /dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 90s

  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud emulators firestore start --host-port=0.0.0.0:8080
    ports:
      - "8079:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      firestore-emulator:
        condition: service_healthy
      scylla1:
        condition: service_healthy
      scylla2:
        condition: service_healthy
      scylla3:
        condition: service_healthy
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SCYLLA_CONTACT_POINTS: ${SCYLLA_CONTACT_POINTS}
      SCYLLA_DATACENTER: ${SCYLLA_DATACENTER}
      SCYLLA_KEYSPACE: ${SCYLLA_KEYSPACE}
      BASKET_TTL_SECONDS: ${BASKET_TTL_SECONDS:-60}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-university-booking-demo}
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080

  frontend:
    build: ./frontend
    ports:
      - "3000:80"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --appendfsync everysec --save 900 1
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  pg-data:
  scylla1-data:
  scylla2-data:
  scylla3-data:
