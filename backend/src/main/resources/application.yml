spring:
  application:
    name: university-booking
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/university_booking}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

firebase:
  project-id: ${FIREBASE_PROJECT_ID:university-booking-demo}
  credentials-path: ${FIREBASE_CREDENTIALS:}

basket:
  ttl-seconds: ${BASKET_TTL_SECONDS:60}

rate-limit:
  max-requests: ${RATE_LIMIT_MAX_REQUESTS:30}
  window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

---
spring:
  config:
    activate:
      on-profile: migration
  main:
    web-application-type: none
  jpa:
    hibernate:
      ddl-auto: validate

migration:
  dry-run: ${MIGRATION_DRY_RUN:false}
