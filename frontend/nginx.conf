server {
    listen 80;
    server_name localhost;

    resolver 127.0.0.11 valid=10s;
    set $backend http://app:8080;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /services {
        proxy_pass $backend;
    }

    location /basket {
        proxy_pass $backend;
    }

    location /bookings {
        proxy_pass $backend;
    }

    location /analytics {
        proxy_pass $backend;
    }

    location /events {
        proxy_pass $backend;
    }
}
