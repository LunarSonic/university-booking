server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /services {
        proxy_pass http://app:8080;
    }

    location /basket {
        proxy_pass http://app:8080;
    }

    location /bookings {
        proxy_pass http://app:8080;
    }
}
